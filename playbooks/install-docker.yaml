- name: 🐳 ติดตั้ง Docker และ Docker Compose
  hosts: all
  become: true

  tasks:
    - name: 📦 อัปเดต apt package
      apt:
        update_cache: yes

    - name: 🐳 ติดตั้ง Docker
      apt:
        name: docker.io
        state: present

    - name: ⚙️ ติดตั้ง curl สำหรับโหลด binary
      apt:
        name: curl
        state: present

    - name: 🧩 ดาวน์โหลด Docker Compose binary
      shell: |
        COMPOSE_VERSION="1.29.2"
        curl -L "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" \
          -o /usr/local/bin/docker-compose
      args:
        creates: /usr/local/bin/docker-compose

    - name: 🔐 ตั้ง permission ให้ Docker Compose
      file:
        path: /usr/local/bin/docker-compose
        mode: '0755'

    - name: 🔗 สร้าง symlink ไปที่ /usr/bin (ถ้ายังไม่มี)
      file:
        src: /usr/local/bin/docker-compose
        dest: /usr/bin/docker-compose
        state: link
        force: no

    - name: 🔍 ตรวจสอบ Docker version
      shell: docker --version
      register: docker_version
      changed_when: false

    - name: 🔍 ตรวจสอบ Docker Compose version
      shell: docker-compose --version
      register: compose_version
      changed_when: false

    - name: 🖨️ แสดงผลเวอร์ชัน Docker
      debug:
        msg: "{{ docker_version.stdout }}"

    - name: 🖨️ แสดงผลเวอร์ชัน Docker Compose
      debug:
        msg: "{{ compose_version.stdout }}"
